[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming-leaderboard"
version = "0.1.0"
requires-python = ">=3.10"
description = "Monthly Redis leaderboard backed by an authoritative match journal"
dependencies = []

[project.scripts]
gaming-leaderboard = "gaming_leaderboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
