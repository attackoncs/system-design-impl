[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-storage-reference"
version = "0.1.0"
description = "Versioned object storage with multipart upload, packed chunks and replicated data nodes"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
object-storage = "object_storage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
