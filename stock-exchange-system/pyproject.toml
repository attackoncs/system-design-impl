[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-exchange-reference"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []
description = "Synthetic deterministic limit order exchange with matching replicas and market data recovery"

[project.scripts]
stock-exchange = "stock_exchange.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
