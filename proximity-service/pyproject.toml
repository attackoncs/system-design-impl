[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proximity-service"
version = "0.1.0"
description = "Versioned geohash proximity service with durable SQLite and HTTP replicas"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
proximity-service = "proximity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
