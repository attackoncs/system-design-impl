[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notification-system"
version = "0.1.0"
description = "A Python asyncio-based notification system library implementing an event-driven pipeline with per-channel queues, worker pools, rate limiting, deduplication, and retry with exponential backoff."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Notification System Authors" },
]
keywords = ["notification", "push", "sms", "email", "asyncio", "event-driven", "rate-limiting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notification_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
