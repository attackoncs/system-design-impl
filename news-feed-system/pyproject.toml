[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-feed-system"
version = "0.1.0"
description = "A Python news feed system library implementing hybrid fanout (push/pull), async message queue, 5-layer cache architecture, and social graph abstraction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "News Feed System Authors" },
]
keywords = ["news-feed", "fanout", "social-graph", "cache", "asyncio", "distributed-systems"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
]

[tool.hatch.build.targets.wheel]
packages = ["src/news_feed_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
