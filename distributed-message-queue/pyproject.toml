[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-message-queue"
version = "0.1.0"
requires-python = ">=3.10"
description = "Segmented replicated logs and fenced consumer groups over HTTP"
dependencies = []

[project.scripts]
message-queue = "message_queue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
