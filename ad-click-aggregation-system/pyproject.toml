[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-click-aggregation"
version = "0.1.0"
description = "Durable partitioned event-time click aggregation reference implementation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ad-click = "ad_click.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
