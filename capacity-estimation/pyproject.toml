[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-estimation-reference"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []
description = "Explicit-unit Decimal capacity and availability estimation"

[project.scripts]
capacity-estimate = "capacity_estimation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
