[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "search-autocomplete-system"
version = "0.1.0"
description = "Versioned batch-built autocomplete with cached tries and HTTP shard replicas."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/search_autocomplete"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
