[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-reservation"
version = "0.1.0"
description = "Sharded hotel reservation reference with atomic inventory and a simulated payment saga"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hotel-reservation = "hotel_reservation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
