<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infrastructure Metrics</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#172c43;max-width:1100px;margin:40px auto;padding:0 20px}h1{font-size:30px}section{background:white;border:1px solid #cbd5e1;border-radius:10px;padding:22px;margin:16px 0}form{display:flex;gap:12px;flex-wrap:wrap}label{display:grid;gap:5px;font-size:13px}input,select,button{font:inherit;padding:9px;border:1px solid #94a3b8;border-radius:5px}button{background:#14588c;color:white;cursor:pointer}img{width:100%;height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.note{color:#52677c}</style>
<h1>Infrastructure Metrics</h1><p class="note">Local reference dashboard · Gauge / counter time series · No logs or traces</p>
<section><form id="form"><label>Read token<input id="token" type="password" required autocomplete="off"></label><label>Metric<input id="metric" value="python_memory_bytes" required></label><label>Aggregation<select id="aggregation"><option>avg</option><option>last</option><option>min</option><option>max</option><option>rate</option><option>increase</option></select></label><label>Exact labels JSON<input id="match" value="{}"></label><label>Lookback minutes<input id="minutes" type="number" min="1" max="1440" value="15"></label><button>Query</button></form><p class="note">Token stays in this page's memory. Counter queries use rate / increase; memory is traced Python allocation, not host RSS.</p></section>
<section><h2 id="heading">Time series</h2><img id="plot" alt="Time series chart"><p id="status" role="status">Enter a read token to query.</p><pre id="detail"></pre></section>
<script>
let previous;
document.getElementById('form').onsubmit=async event=>{event.preventDefault();const status=document.getElementById('status');status.textContent='Querying…';try{const end=Date.now()/1000;const params=new URLSearchParams({metric:document.getElementById('metric').value,start:end-60*Number(document.getElementById('minutes').value),end,aggregation:document.getElementById('aggregation').value,match:document.getElementById('match').value});JSON.parse(params.get('match'));const headers={Authorization:'Bearer '+document.getElementById('token').value};const response=await fetch('/query?'+params,{headers});const body=await response.json();if(!response.ok)throw new Error(body.error);const image=await fetch('/chart.svg?'+params,{headers});if(!image.ok)throw new Error('Chart request failed');const blob=await image.blob();if(previous)URL.revokeObjectURL(previous);previous=URL.createObjectURL(blob);document.getElementById('plot').src=previous;document.getElementById('heading').textContent=params.get('metric');status.textContent=body.series.length+' series · '+body.step+'s buckets · revision '+body.revision;document.getElementById('detail').textContent=JSON.stringify(body,null,2)}catch(error){status.textContent=error.message}};
</script></html>
