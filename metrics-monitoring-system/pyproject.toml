[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics-monitoring-system"
version = "0.1.0"
requires-python = ">=3.10"
description = "Durable metrics pipeline, tiered time series and stateful alerting"
dependencies = []

[project.scripts]
metrics-monitor = "metrics_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metrics_monitor = ["dashboard.html"]
