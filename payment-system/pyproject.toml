[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-system-reference"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []
description = "Simulated payment execution with immutable double-entry ledger and reconciliation"

[project.scripts]
payment-system = "payment_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
