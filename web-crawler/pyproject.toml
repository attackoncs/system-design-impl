[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-crawler"
version = "0.1.0"
description = "An asyncio-based Python web crawler library with URL frontier, politeness, robots.txt compliance, content deduplication, and pluggable components."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Web Crawler Authors" }]
keywords = ["web-crawler", "spider", "asyncio", "url-frontier", "robots-txt", "crawling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "hypothesis"]

[tool.hatch.build.targets.wheel]
packages = ["src/web_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
