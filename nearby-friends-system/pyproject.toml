[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nearby-friends-system"
version = "0.1.0"
description = "Authorized live nearby friends with Redis Pub/Sub and WebSockets"
requires-python = ">=3.10"
dependencies = ["websockets>=14,<17", "redis>=5,<7"]

[project.scripts]
nearby-friends = "nearby_friends.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
