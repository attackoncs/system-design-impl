[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-system"
version = "0.1.0"
requires-python = ">=3.10"
description = "Lazy tiled road routing, traffic ingestion and versioned map tiles"
dependencies = []

[project.scripts]
maps-system = "maps_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
